[package]
name = "lang-changer"
version = "0.1.0"
edition = "2021"

[lib]
name = "lang_changer"
path = "src/lib.rs"

[[bin]]
name = "lang-changer"
path = "src/main.rs"

[dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tray-icon = "0.26.1"
